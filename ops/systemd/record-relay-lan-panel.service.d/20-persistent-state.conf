[Service]
StateDirectory=
StateDirectory=record-relay record-relay-exports
StateDirectoryMode=0700
ExecStart=
ExecStart=/usr/bin/python3 /opt/record-relay/app/panel.py /run/record-relay/control.sock --library /var/lib/record-relay/recordings --state-dir /var/lib/record-relay/app-state --listen 192.168.7.214 --allow-network 192.168.7.0/24
