<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Relay</title>
<style>
:root{color-scheme:dark;--paper:#f6e7ce;--ink:#222224;--bg:#181719;--surface:#252328;--line:#49434b;--accent:#f4bb75}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--paper);font:1rem/1.45 'Avenir Next',Avenir,sans-serif}
main{width:min(1050px,100%);margin:auto;padding:clamp(1.25rem,5vw,4rem)}
h1,h2,h3{font-family:Georgia,serif;line-height:1.12;margin:.1em 0 .65em}
h1{font-size:clamp(2.6rem,7vw,5rem);letter-spacing:-.05em}
h2{font-size:clamp(1.5rem,3vw,2.2rem)}
section{border-top:1px solid var(--line);padding:1.35rem 0;margin-top:1.25rem}
label{display:block;margin:.65rem 0}
input,button,select{font:inherit;max-width:100%}
input:not([type=checkbox]),select{display:block;background:var(--surface);color:var(--paper);border:1px solid var(--line);border-radius:.25rem;padding:.45rem .55rem}
button{background:var(--accent);color:var(--ink);border:0;border-radius:.27rem;padding:.55rem .85rem;margin:.15rem .35rem .15rem 0;cursor:pointer;font-weight:600}
button:disabled{opacity:.45;cursor:default}
a{color:var(--accent);text-underline-offset:.25em}
:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
audio,canvas{width:100%;display:block;margin:1rem 0}
canvas{background:#29232b;border:1px solid var(--line);height:clamp(110px,20vw,180px)}
ol{margin-block:1.2rem;padding-left:1.35rem}
li{padding:.9rem 0;border-top:1px solid var(--line)}
li strong{font-family:Georgia,serif;font-size:1.2rem}
[hidden]{display:none!important}
</style>
<main>
<h1>Record Relay</h1>
<section aria-labelledby="identify-heading">
<h2 id="identify-heading">Track identification</h2>
<label><input type="checkbox" id="identify"> Identify tracks</label>
<label><input type="checkbox" id="scrobble"> Scrobble verified listening</label>
<label><input type="checkbox" id="local_listening"> I’m listening locally (expires in 30 minutes)</label>
<p id="track">Waiting for session status.</p>
<p id="scrobble-progress" hidden></p>
</section>
<section aria-labelledby="record-heading">
<h2 id="record-heading">Record a side</h2>
<form>
<label>Filename <input id="name" placeholder="Side name.wav" required></label>
<label>Maximum minutes <input id="limit" value="30" type="number" min="1" max="60" required></label>
<button id="start-recording">Start recording</button>
<button type="button" id="stop" hidden>Stop recording</button>
</form>
<p id="recording"></p>
<section id="buffer-panel" hidden aria-labelledby="buffer-heading">
<h3 id="buffer-heading">Recent turntable audio</h3>
<p id="buffer-status"></p>
<p>Up to 10 minutes in memory. Older audio is replaced. The buffer expires after 10 minutes of silence or a restart.</p>
<button type="button" id="save-buffer">Save buffered audio and keep recording</button>
</section>
</section>
<p id="message" role="status"></p>
<p>__RECORDINGS_LINK__<a href="/review/">Review track splits</a></p>
</main>
<script>
const el = id => document.getElementById(id);
let pending = false;
let filenameEdited = false;
const startedAt = new Date();
el("name").value = "Side " + startedAt.toLocaleDateString("sv-SE") + " " +
  startedAt.toTimeString().slice(0,8).replaceAll(":", "-") + ".wav";
async function request(data) {
  const response = await fetch("/control", {
    method:"POST", headers:{"Content-Type":"application/json","X-Control-Token":"__CONTROL_TOKEN__"},
    body:JSON.stringify(data)
  });
  const result = await response.json();
  if (result.error) throw new Error(result.error);
  return result;
}
async function update(data) {
  if (pending) return;
  pending = true;
  try {
    if (data.action !== "status") {
      const result = await request(data);
      el("message").textContent = result.recorded_frames === undefined ? "" :
        "Saved " + result.recorded_frames + " frames.";
    }
    const state = await request({action:"status"});
    el("buffer-panel").hidden = state.buffered_seconds === undefined;
    const seconds = Math.floor(state.buffered_seconds || 0);
    el("buffer-status").textContent = seconds ? Math.floor(seconds/60) + ":" +
      String(seconds%60).padStart(2, "0") + " available to save" : "Waiting for turntable audio.";
    const isRecording = state.recording === "recording";
    el("start-recording").hidden = state.recording !== "idle";
    el("stop").hidden = state.recording === "idle";
    el("stop").textContent = isRecording ? "Stop and save recording" : "Finalize recording";
    el("save-buffer").disabled = seconds < 1 || state.recording !== "idle";
    if (isRecording) el("buffer-status").textContent = "Recording now. Stop and save before starting another side.";
    else if (!seconds) el("buffer-status").textContent = "No audio retained yet. Start the turntable to fill the buffer.";
    if (!filenameEdited && state.suggested_filename && state.recording === "idle") {
      el("name").value = state.suggested_filename;
    }
    el("identify").checked = state.identify;
    el("scrobble").checked = state.scrobble;
    el("local_listening").checked = state.local_listening;
    el("local_listening").closest("label").hidden = state.local_listening === undefined;
    el("local_listening").disabled = !state.scrobble;
    el("track").textContent = state.track ? [state.track.artist,state.track.title].filter(Boolean).join(" — ") : "No track identified.";
    const progress = state.scrobble_progress;
    el("scrobble-progress").hidden = !state.scrobble;
    el("scrobble-progress").textContent = progress?.submitted ? "ListenBrainz accepted this listen." :
      progress?.required_seconds ? Math.min(progress.seconds, progress.required_seconds) +
        " of " + progress.required_seconds + " verified listening seconds" :
      "Waiting for a recognized track and verified playback.";
    const reason = state.recognition_timing?.waiting_for;
    if (state.identify && !state.track) {
      const labels = {
        quiet: "Waiting for audio.", fresh_audio: "Collecting fresh audio.",
        lookup_in_progress: "Identifying the track…", short_retry: "No match yet. A retry is queued.",
        backoff: "Waiting to retry recognition.", provider_backoff: "Recognition provider asked us to wait.",
        hourly_budget: "Hourly recognition limit reached.", gap_budget: "Waiting for the recent-gap request limit.",
        periodic_check: "Waiting for a gap or the next periodic check."
      };
      el("track").textContent = labels[reason] || "No track identified.";
    }
    el("recording").textContent = "Recording: " + state.recording;
    if (state.scrobble_error) el("message").textContent = "Playback verification or scrobble failed.";
    if (state.recognition_error) el("message").textContent = "Recognition request failed.";
  } catch (error) {
    el("message").textContent = error.message;
    if (["identify","scrobble","local_listening"].includes(data.action)) el(data.action).checked = !data.enabled;
  } finally {
    pending = false;
  }
}
el("identify").onchange = event => update({action:"identify",enabled:event.target.checked});
el("scrobble").onchange = event => update({action:"scrobble",enabled:event.target.checked});
el("local_listening").onchange = event => update({action:"local_listening",enabled:event.target.checked});
document.querySelector("form").onsubmit = event => {
  event.preventDefault();
  update({action:"record",name:el("name").value,limit:el("limit").valueAsNumber*60});
};
el("name").oninput = () => { filenameEdited = true; };
el("save-buffer").onclick = () => update({action:"save_buffer",name:el("name").value,limit:el("limit").valueAsNumber*60});
el("stop").onclick = () => update({action:"stop"});
update({action:"status"});
setInterval(() => update({action:"status"}), 3000);
</script>
</html>
